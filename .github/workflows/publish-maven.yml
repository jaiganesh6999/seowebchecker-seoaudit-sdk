name: Build and Package Java (Maven)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build, Sign & Package for Sonatype Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Jar, Sources, Javadocs)
        run: |
          cd java
          mvn clean package -DskipTests=false

      - name: Generate GPG Key, Sign Artifacts & Create Checksums
        run: |
          cd java
          # 1. Generate GPG Key for signing
          export GPG_TTY=$(tty || echo "")
          gpg --batch --passphrase '' --quick-generate-key "SEOWebChecker <support@seowebchecker.com>" default default never
          KEY_ID=$(gpg --list-keys --with-colons "support@seowebchecker.com" | awk -F: '/^pub:/ { print $5 }')
          echo "Generated GPG Key ID: $KEY_ID"

          # Publish public key to keyservers (required by Sonatype validation)
          gpg --keyserver keyserver.ubuntu.com --send-keys "$KEY_ID" || true
          gpg --keyserver keys.openpgp.org --send-keys "$KEY_ID" || true

          # 2. Copy and rename pom to standard Maven artifact name
          cp pom.xml target/seowebchecker-seoaudit-sdk-1.0.0.pom

          # 3. Create bundle staging directory
          mkdir -p bundle_flat

          # Copy all 4 base artifacts
          cp target/seowebchecker-seoaudit-sdk-1.0.0.pom bundle_flat/
          cp target/seowebchecker-seoaudit-sdk-1.0.0.jar bundle_flat/
          cp target/seowebchecker-seoaudit-sdk-1.0.0-sources.jar bundle_flat/
          cp target/seowebchecker-seoaudit-sdk-1.0.0-javadoc.jar bundle_flat/

          # 4. Sign and create md5/sha1 checksums for each artifact
          cd bundle_flat
          for f in *; do
            if [[ -f "$f" ]]; then
              echo "Signing and hashing: $f"
              # Sign (.asc)
              gpg --batch --yes --armor --detach-sign "$f"
              # Checksums (.md5 and .sha1)
              md5sum "$f" | awk '{print $1}' > "${f}.md5"
              sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
            fi
          done

          echo "Bundle contents:"
          ls -la

          # 5. Create final zip bundle for Sonatype Central Portal
          zip -r ../sonatype-central-bundle.zip .

      - name: Upload Sonatype Central Bundle
        uses: actions/upload-artifact@v4
        with:
          name: sonatype-central-bundle
          path: java/sonatype-central-bundle.zip
