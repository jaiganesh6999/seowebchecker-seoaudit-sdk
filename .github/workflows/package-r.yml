name: Build and Check R Package for CRAN

on:
  push:
    paths:
      - 'r/**'
      - '.github/workflows/package-r.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    name: R CMD check & Package (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Test Dependencies
        run: |
          Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Build R Package Source Tarball
        run: |
          R CMD build r
          ls -la seowebchecker_*.tar.gz

      - name: Run R CMD check --as-cran
        run: |
          R CMD check --as-cran seowebchecker_*.tar.gz

      - name: Upload CRAN Source Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seowebchecker-cran-tarball
          path: seowebchecker_*.tar.gz
